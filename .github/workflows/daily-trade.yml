name: daily-trade

# The robot, every evening, on the IBKR PAPER account (Alpaca retired 2026-10-04).
# Starts IB Gateway in a container (paper logins need no 2FA), runs run_signal.py,
# builds the snapshot, applies the brake, and sends ONE Telegram report per evening.
#
# Triggers: the Windows task ClaudeTrading-Dispatch-EOD (20:10 New York, on time)
# and this cron as the fallback (GitHub cron is best-effort, observed 3-5 h late).
# A second run the same evening trades nothing (per-session idempotency) and
# sends nothing (routines_pkg/send_report.py).
on:
  schedule:
    - cron: '20 0 * * *'      # 20:20 EDT / 19:20 EST, after the 16:00 close and the 00:00 UTC crypto close
  workflow_dispatch:
    inputs:
      mode:
        description: 'eod (only mode left)'
        required: true
        default: 'eod'
        type: choice
        options:
          - eod

permissions:
  contents: write   # required so the run can commit memory/journal updates back

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IBKR_USERNAME: ${{ secrets.IBKR_USERNAME }}
      IBKR_PASSWORD: ${{ secrets.IBKR_PASSWORD }}
      IBKR_PORT: '4002'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A queued run checks out the commit from when it was triggered. If an earlier run
      # pushed log lines meanwhile, trading on the stale log would lose them at push time.
      - name: Sync to latest master
        run: git pull --ff-only origin master

      - name: Verify required secrets
        shell: bash
        run: |
          for name in IBKR_USERNAME IBKR_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then echo "::error ::$name is not set as a repo secret."; exit 1; fi
          done

      # Pull + login take a minute or two; start now so it overlaps with pip and the tests.
      # Paper only: TRADING_MODE=paper, and run_signal refuses any non-DU account (brokers/ibkr.py).
      # The image receives the paper password, so it is pinned by digest (= the `stable` tag on
      # 2026-10-04, IB Gateway 10.50 + IBC 3.24.2). Bump it deliberately, never by tag.
      # Credentials go through an env file (mode 600) so they never appear in the process list.
      # READ_ONLY_API=no because the robot must place orders.
      - name: Start IB Gateway (paper)
        shell: bash
        run: |
          umask 077
          printf 'TWS_USERID=%s\nTWS_PASSWORD=%s\n' "$IBKR_USERNAME" "$IBKR_PASSWORD" > "$RUNNER_TEMP/ibgw.env"
          docker run -d --name ibgw -p 127.0.0.1:4002:4004 --env-file "$RUNNER_TEMP/ibgw.env" \
            -e TRADING_MODE=paper -e READ_ONLY_API=no -e TWS_ACCEPT_INCOMING=accept \
            -e TIME_ZONE=America/New_York \
            ghcr.io/gnzsnz/ib-gateway@sha256:e340626b5569d476bb96f891b5435ec9b9da517afd1e03c71e73fc50188477b1
          rm -f "$RUNNER_TEMP/ibgw.env"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (no trading on a red suite)
        run: python -m pytest -q

      - name: Run the robot
        id: robot
        timeout-minutes: 8
        run: python run_signal.py

      - name: Build snapshot + daily report
        id: snapshot
        if: always()
        timeout-minutes: 5
        run: python -m routines_pkg.desk_snapshot --report > "$RUNNER_TEMP/daily-report.txt"

      # Unacknowledged "halt" flags write .HALT (robot stops next run) and text Rayyan.
      - name: Auto-halt (deterministic brake)
        if: always() && steps.snapshot.outcome == 'success'
        run: python -m routines_pkg.auto_halt

      - name: Send the daily report (once per evening)
        if: always() && steps.snapshot.outcome == 'success'
        env:
          ROBOT_OK: ${{ steps.robot.outcome == 'success' }}
        run: python -m routines_pkg.send_report "$RUNNER_TEMP/daily-report.txt"

      - name: Commit memory + journal updates
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory journal
          if [ -f .HALT ]; then git add -f .HALT; fi
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "routine: ibkr eod $(date -u +%Y-%m-%dT%H:%MZ)"
            # Push with retry to handle the rare race with another routine.
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase --autostash
            done
            git push
          fi

      - name: Gateway log (on failure)
        if: failure() || cancelled()
        run: docker logs --tail 80 ibgw 2>&1 | grep -v -i password || true

      - name: Alert on failure
        if: failure() || cancelled()
        run: python -m paper_trading.notify "🔥 daily-trade FAILED — no report tonight. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Stop IB Gateway
        if: always()
        run: docker rm -f ibgw || true

      - name: Surface confidence-log tail (self-test)
        if: always()
        shell: bash
        run: |
          echo "::group::confidence-log tail"
          tail -n 5 memory/confidence-log-ibkr.md || true
          echo "::endgroup::"
